name: Feature request
description: Suggest a focused improvement to Pagecraft.
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Clear publishing and authoring workflows make feature requests easier to evaluate.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the publishing, authoring, or deployment problem rather than only the proposed implementation.
      placeholder: I need to ... because ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the command, configuration, generated output, or template behavior you expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or related approaches, if any.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, sketches, links, or implementation notes that would help evaluate the request.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues before opening this request.
          required: true
