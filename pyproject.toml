[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pagecraft"
version = "0.1.0"
description = "A Markdown-to-HTML static site generator with layouts, tags, RSS feeds, syntax highlighting, asset copying, and incremental builds."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "BHARANI KUMAR S", email = "itsmebk2007@gmail.com" },
]
keywords = ["static-site", "markdown", "blog", "generator", "rss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "markdown>=3.4",
    "pygments>=2.15",
    "jinja2>=3.1",
    "python-frontmatter>=1.0",
    "pyyaml>=6.0",
    "watchdog>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pagecraft = "pagecraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
