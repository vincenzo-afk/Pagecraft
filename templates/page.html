{% extends "base.html" %}

{% block title %}{{ page.title }} &mdash; {{ site.title }}{% endblock %}
{% block description %}{{ site.description }}{% endblock %}

{% block content %}
<article class="page">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
  </header>
  <div class="post-body">
    {{ page.html }}
  </div>
</article>
{% endblock %}
