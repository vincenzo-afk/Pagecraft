[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pagecraft"
version = "0.2.0"
description = "A thoughtful Markdown static site generator with templates, taxonomy pages, feeds, discovery files, and safe incremental builds."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "vincenzo-afk", email = "itsmebk2007@gmail.com" },
]
keywords = ["static-site-generator", "markdown", "blog", "rss", "sitemap", "jinja2", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "markdown>=3.4",
  "pygments>=2.15",
  "jinja2>=3.1",
  "python-frontmatter>=1.0",
  "pyyaml>=6.0",
  "watchdog>=3.0",
]

[project.urls]
Homepage = "https://github.com/vincenzo-afk/Pagecraft"
Repository = "https://github.com/vincenzo-afk/Pagecraft"
Issues = "https://github.com/vincenzo-afk/Pagecraft/issues"

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "build>=1.2"]

[project.scripts]
pagecraft = "pagecraft.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pagecraft = ["resources/templates/*.html", "resources/static/*.css"]
